name: Ingesta Mercadona

on:
  schedule:
    - cron: "17 5,11,17,23 * * *"   # 4 veces al día (UTC): ~06:17, 12:17, 18:17, 00:17 hora peninsular
  workflow_dispatch:                 # botón para lanzarlo a mano

permissions:
  contents: write                    # necesario para el keepalive del día 1

jobs:
  ingesta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar ingesta
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python ingest_supabase.py

      # Evita que GitHub desactive el cron tras 60 días sin actividad:
      # el día 1 de cada mes hace un commit vacío que resetea el contador.
      - name: Keepalive (1 vez al mes)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date +%d)" = "01" ]; then
            git config user.name "keepalive"
            git config user.email "keepalive@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: mantener el cron activo"
            git push
          fi
